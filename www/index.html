<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' data: gap: https://ssl.gstatic.com;
               style-src 'self' 'unsafe-inline';
               media-src *;
               img-src 'self' data: content:;
               connect-src 'self' https://adeapp.bordeaux-inp.fr http://localhost:3000;">

    <title>ADE Viewer</title>
    <link rel="stylesheet" href="css/index.css" />
</head>

<body>
    <div id="app">
        <header>
            <img class="header-logo" src="res/img/icon.svg" alt="ADE logo">
            <div class="menu-buttons">
                <img id="toggle-home-view" class="clickable" src="res/img/icons/home.svg" alt="home icon">
            </div>
        </header>

        <main>
            <div id="home-view" class="view active-view">
                <div id="next-events-container">
                    <img class="open-week-btn clickable"  id="toggle-week-view" src="res/img/icons/arrow-angle.svg" alt="arrow up angle icon">

                    <div id="next-events">
                        <p class="next-events-title">3 prochains cours</p>

                        <div id="day-events-container">
                            <p style="text-align: center;">Chargement...</p>
                        </div>
                    </div>  
                </div>

                <div id="next-homeworks">
                    <p class="next-homeworks-title">Travail à faire pour les prochains jours</p>

                    <div id="homeworks-container">
                        <div class="day-homeworks">
                            <p class="day-title">Pour <span class="bold">aujourd'hui</span></p>
                            <div class="homework">
                                <div class="header">
                                    <div class="course-name">FRANCAIS</div>
                                    <div class="made">Non Fait</div>
                                </div>
                                <p class="homework-description"></p>
                                <div class="footer">
                                    <label for="homework-x-made">J'ai terminé</label>
                                    <input class="classic-checbox" type="checkbox" id="homework-x-made" name="homework-x-made" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="week-view" class="view">
                <div class="navigator-bar">
                    <button id="preview-day-btn">&#8249;</button>
                    <p>lun.16 juin</p>
                    <button id="next-day-btn">&#8250;</button>
                </div>

                <div id="week-events-container">
                </div>
            </div>
        </main>

        <footer>
            <div class="left">
                <p id="last-update-label">⌛ Mis à jour il y a <span>0mn</span></p>
                <img class="action-btn clickable" id="refresh-cal-btn" src="res/img/icons/reload.svg" alt="refresh planning icon">
            </div>
            <div class="right">
                <img class="action-btn clickable" id="change-address-btn" src="res/img/icons/qrcode.svg" alt="qrcode icon">
            </div>
        </footer>

        <div id="change-address-modal">
            <div class="modal-content">
                <img id="close-address-modal-btn" class="clickable" src="res/img/icons/cross.svg" alt="close icon">

                <h2>Charger un emploi du temps</h2>
                <div class="seperator"></div>

                <div class="mediums-container">
                    <button id="open-scanner-btn" class="clickable">Scanner un QR code</button>
                    <p class="or-separator">OU</p>
                    <input type="text" id="address-input" placeholder="Entrez l'adresse de votre emploi du temps">
                </div>

                <button id="save-address-btn" class="clickable">Sauvegarder</button>
            </div>
        </div>

        <div id="loader-container">
            <span id="loader"></span>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script type="module" src="js/index.js"></script>
</body>

</html>
